<!-- qr_absensi_app/templates/add_student.html -->
{% extends 'base.html' %} {% block content %}
<h2 class="text-4xl font-bold text-gray-800 mb-8 text-center">
  Tambah Mahasiswa Baru
</h2>

<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-xl">
  <form method="post">
    <div class="mb-5">
      <label for="nama" class="block text-gray-700 text-sm font-bold mb-2"
        >Nama Mahasiswa:</label
      >
      <input
        type="text"
        id="nama"
        name="nama"
        required
        class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
        placeholder="Masukkan Nama Mahasiswa"
      />
    </div>
    <div class="mb-6">
      <label for="nis" class="block text-gray-700 text-sm font-bold mb-2"
        >NIM (Nomor Induk Mahasiswa):</label
      >
      <input
        type="text"
        id="nis"
        name="nis"
        required
        class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
        placeholder="Masukkan NIM"
      />
    </div>
    <div class="flex flex-col items-center">
      {# Changed to flex-col for vertical stacking #}
      <button
        type="submit"
        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75 transform transition duration-300 hover:scale-105 w-full mb-4"
      >
        {# Added w-full and mb-4 #} Tambahkan Mahasiswa
      </button>
      <a
        href="{{ url_for('admin_dashboard') }}"
        class="inline-block align-baseline font-bold text-base text-blue-600 hover:text-blue-800"
      >
        {# Changed text-sm to text-base #} Kembali ke Dashboard
      </a>
    </div>
  </form>
</div>
{% endblock %}
