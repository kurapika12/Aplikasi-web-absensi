<!-- qr_absensi_app/templates/attendance_records.html -->
{% extends 'base.html' %}

{% block head %}
<script src="{{ url_for('static', filename='js/attendance_records.js') }}"></script>
{% endblock %}

{% block content %}
<h2 class="text-4xl font-bold text-gray-800 mb-8 text-center">Riwayat Absensi</h2>

<div class="bg-white p-6 rounded-lg shadow-xl mb-8">
    <div class="flex flex-col sm:flex-row items-center justify-center space-y-4 sm:space-y-0 sm:space-x-4">
        <label for="filter_date" class="text-gray-700 font-semibold text-lg">Pilih Tanggal:</label>
        <input type="date" id="filter_date" name="filter_date" value="{{ selected_date }}"
               class="p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200 text-lg">
        <button id="applyFilter"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75 transform transition duration-300 hover:scale-105 text-lg">
            Filter
        </button>
    </div>
</div>

<div class="bg-white p-6 rounded-lg shadow-xl overflow-x-auto">
    <table class="min-w-full leading-normal table-auto">
        <thead>
            <tr>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider rounded-tl-lg">
                    Nama Mahasiswa
                </th>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                    NIM
                </th>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                    Waktu Absen
                </th>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider rounded-tr-lg">
                    Aksi
                </th>
            </tr>
        </thead>
        <tbody id="attendanceTableBody">
            <!-- Data absensi akan dimuat di sini oleh JavaScript -->
        </tbody>
    </table>
    <p id="noRecordsMessage" class="text-center text-gray-600 text-lg py-10 hidden">Tidak ada data absensi untuk tanggal ini.</p>
</div>

<div class="text-center mt-8">
    <a href="{{ url_for('admin_dashboard') }}"
       class="inline-block bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg shadow-md transition duration-300">
        Kembali ke Dashboard Admin
    </a>
</div>
{% endblock %}
